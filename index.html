<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Sledování zakázky</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 16px; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: white; padding: 28px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center; }
        .brand-header { font-size: 14px; font-weight: 800; color: #0066cc; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        h1 { font-size: 22px; margin: 0 0 8px 0; color: #111; }
        p { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 14px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 16px; text-transform: uppercase; text-align: center; font-weight: bold; background: #fff; }
        input:focus { border-color: #0066cc; outline: none; }
        .btn { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .status-card { background: #f8f9fa; border: 1px solid #e1e4e8; border-radius: 10px; padding: 18px; margin-top: 15px; text-align: left; }
        .status-title { font-size: 17px; font-weight: bold; color: #111; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-spz { background: #eef2f7; padding: 4px 8px; border-radius: 6px; color: #0066cc; font-family: monospace; }
        .status-row { font-size: 14px; margin-bottom: 8px; color: #444; }
        .error-msg { color: #d9534f; font-weight: 600; font-size: 14px; background: #fdf7f7; padding: 12px; border-radius: 8px; border: 1px solid #f9dbdb; }
        .admin-link { display: inline-block; margin-top: 30px; font-size: 13px; color: #888; text-decoration: none; }
        .admin-link:hover { color: #0066cc; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">P&R MONT</div>
    <h1>Sledování zakázky</h1>
    <p>Zadejte registrační značku (SPZ) vašeho vozidla a zjistěte aktuální stav opravy.</p>
    
    <div class="search-box">
        <input type="text" id="searchSpz" placeholder="např. 1B23456">
        <button onclick="searchCar()" class="btn">Hledat</button>
    </div>

    <div id="resultContainer"></div>

    <a href="/admin.html" class="admin-link">🔒 Vstup pro mechaniky</a>
</div>

<script>
    let allCars = [];

    fetch('/api/vehicles')
        .then(res => res.json())
        .then(data => { allCars = data; })
        .catch(err => console.error('Chyba při načítání:', err));

    function searchCar() {
        const query = document.getElementById('searchSpz').value.trim().toUpperCase();
        const container = document.getElementById('resultContainer');
        
        if (!query) {
            container.innerHTML = '<div class="error-msg">Zadejte prosím SPZ vozidla.</div>';
            return;
        }

        const found = allCars.find(car => car.spz.replace(/\s+/g, '').toUpperCase() === query.replace(/\s+/g, ''));

        if (!found) {
            container.innerHTML = '<div class="error-msg">Vozidlo s touto SPZ nebylo v systému nalezeno.</div>';
            return;
        }

        container.innerHTML = `
            <div class="status-card">
                <div class="status-title">
                    <span>${found.model}</span>
                    <span class="status-spz">${found.spz}</span>
                </div>
                <div class="status-row"><strong>Stav opravy:</strong><br><span style="color: #0066cc; font-weight: bold; font-size: 15px;">${found.status}</span></div>
                <div class="status-row" style="margin-top: 10px;"><strong>Poznámka servisu:</strong><br><span style="color: #666;">${found.note || 'Žádná doplňující poznámka'}</span></div>
            </div>
        `;
    }

    document.getElementById('searchSpz').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchCar();
    });
</script>
</body>
</html>
